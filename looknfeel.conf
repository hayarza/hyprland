# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
     gaps_in = 3
     gaps_out = 3
     border_size = 1
     col.active_border = rgba(4a7fa4ee) rgba(7f5fa4ee) 45deg
     col.inactive_border = rgba(565f8944)
     # no_border_on_floating = true

    # Use master layout instead of dwindle
    # layout = master
}


animations {
    enabled = true
    # bezier = smooth, 0.25, 0.1, 0.25, 1
    bezier = snappy, 0.4, 0, 0.2, 1
    animation = windows, 1, 1.2, snappy
    animation = fade, 1, 1.2, snappy
    animation = workspaces, 1, 1.2, snappy, slide
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    active_opacity = 1
    inactive_opacity = 2
    dim_inactive = true
    dim_strength = 0.25
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1b26aa)
      }
}
